services:
  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ai-engineering-platform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FORGEFLOW_ADMIN_PASSWORD: ${FORGEFLOW_ADMIN_PASSWORD:?Set FORGEFLOW_ADMIN_PASSWORD in .env}
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai-engineering-platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"

