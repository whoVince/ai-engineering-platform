spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:ai-engineering-platform;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

ai-engineering-platform:
  security:
    admin:
      username: ${FORGEFLOW_ADMIN_USERNAME:admin}
      password: ${FORGEFLOW_ADMIN_PASSWORD}

