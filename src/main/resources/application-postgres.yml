spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ai-engineering-platform}
    username: ${SPRING_DATASOURCE_USERNAME:ai-engineering-platform}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

ai-engineering-platform:
  security:
    admin:
      username: ${FORGEFLOW_ADMIN_USERNAME:admin}
      password: ${FORGEFLOW_ADMIN_PASSWORD}

